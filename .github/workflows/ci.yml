name: CI

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # NON usare go-version-file: go.mod dichiara `go 1.23`, ramo Go ormai
          # fuori supporto (nessuna patch di sicurezza: govulncheck segnala
          # decine di CVE della stdlib). Si usa un ramo supportato e
          # check-latest per avere sempre l'ultima patch.
          # 1.26: govulncheck (CI del 2026-10-19) segnala 9 vulnerabilità della
          # stdlib raggiunte dal codice (net/http, net/textproto, crypto/tls,
          # html/template) presenti in 1.25.14 e corrette in 1.26.9. check-latest
          # garantisce l'ultima patch del ramo.
          go-version: '1.26'
          check-latest: true
          cache: true

      # go-libsql è un binding CGO: gcc è già presente su ubuntu-latest.
      - name: Download modules
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Tests (integration incluse)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
