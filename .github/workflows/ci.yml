name: CI

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # go.mod dichiara `go 1.26`, lo stesso ramo usato qui. Si tiene la
          # versione esplicita con check-latest per avere sempre l'ultima patch
          # (go-version-file non seleziona la patch più recente).
          # 1.26: govulncheck (CI del 2026-10-19) segnala 9 vulnerabilità della
          # stdlib raggiunte dal codice (net/http, net/textproto, crypto/tls,
          # html/template) presenti in 1.25.14 e corrette in 1.26.9. check-latest
          # garantisce l'ultima patch del ramo.
          go-version: '1.26'
          check-latest: true
          cache: true

      # go-libsql è un binding CGO: gcc è già presente su ubuntu-latest.
      - name: Download modules
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Tests (integration incluse)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
