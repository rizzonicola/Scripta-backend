name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # go.mod dichiara `go 1.26` e richiede il toolchain 1.26.10: la patch
          # include le correzioni stdlib segnalate da govulncheck, compresa
          # GO-2026-6809 (crypto/x509). Il pin esplicito rende la CI
          # riproducibile e impedisce di testare con una patch precedente.
          go-version: '1.26.10'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - name: Tests (integration incluse)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # L'immagine è un indice multi-arch: lo stesso tag `latest` (e gli stessi
      # tag di versione) contiene sia linux/amd64 sia linux/arm64. Docker sceglie
      # automaticamente la variante giusta in base all'architettura del client:
      # su ARM64 scarica l'immagine ARM64, su x86-64 quella amd64. Non serve un
      # repository separato tipo `scripta-backend-arm64`, che sarebbe solo un
      # doppione e costringerebbe l'utente a ricordarsi quale nome usare.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Build multi-arch: il runner è amd64, QEMU emula ARM64 durante la
          # build. La cache GHA evita di ricompilare tutto a ogni push.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

