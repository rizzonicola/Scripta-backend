{{define "admin_login.html"}}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f7fb" />
  <title data-i18n="pageTitle">Accesso Admin · Note Markdown</title>
  <script nonce="{{.Nonce}}">
    (function () {
      try {
        var stored = localStorage.getItem('scripta_admin_theme') || 'auto';
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'auto' ? (dark ? 'dark' : 'light') : stored;
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style nonce="{{.Nonce}}">
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #111827;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --success: #15803d;
      --success-soft: #dcfce7;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 24px 60px rgba(15, 23, 42, .08);
      --radius: 14px;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #172033;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #263349;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --danger: #f87171;
      --danger-soft: #3f1d1d;
      --success: #4ade80;
      --success-soft: #14351f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 24px 60px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
        var(--bg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-wrap { width: 100%; max-width: 380px; }
    .login-header { text-align: center; margin-bottom: 20px; }
    .login-header h1 { font-size: 21px; margin: 0 0 5px; letter-spacing: -0.02em; }
    .login-header p { font-size: 13px; color: var(--muted); margin: 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
    }
    label.field-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field { margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 15px;
      background: var(--surface);
      color: var(--text);
    }
    input:focus, button:focus-visible, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (max-width: 480px) {
      input { font-size: 16px; }
    }
    button {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .flash {
      padding: 10px 14px;
      border-radius: 9px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .flash.ok { background: var(--success-soft); color: var(--success); }
    .flash.error { background: var(--danger-soft); color: var(--danger); }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .control select {
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      background: var(--surface);
      color: var(--text);
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <h1 data-i18n="heading">📝 Amministrazione — Note Markdown</h1>
      <p data-i18n="subheading">Accesso riservato agli amministratori</p>
    </div>

    <div class="card">
      {{if .Flash}}
        <div class="flash {{if .FlashIsError}}error{{else}}ok{{end}}" role="status">{{.Flash}}</div>
      {{end}}

      <form method="POST" action="/admin/login">
        <div class="field">
          <label class="field-label" for="username" data-i18n="usernameLabel">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
            autofocus
          />
        </div>
        <div class="field">
          <label class="field-label" for="password" data-i18n="passwordLabel">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" data-i18n="loginBtn">Accedi</button>
      </form>
    </div>

    <div class="controls">
      <div class="control">
        <label for="lang-select" data-i18n="langLabel">Lingua</label>
        <select id="lang-select">
          <option value="auto" data-i18n="langAuto">Sistema / Auto</option>
          <option value="it" data-i18n="langIt">Italiano</option>
          <option value="en" data-i18n="langEn">English</option>
          <option value="fr" data-i18n="langFr">Français</option>
        </select>
      </div>
      <div class="control">
        <label for="theme-select" data-i18n="themeLabel">Tema</label>
        <select id="theme-select">
          <option value="auto" data-i18n="themeAuto">Sistema / Auto</option>
          <option value="light" data-i18n="themeLight">Chiaro</option>
          <option value="dark" data-i18n="themeDark">Scuro</option>
        </select>
      </div>
    </div>
  </div>

  <script nonce="{{.Nonce}}">
    var translations = {
      it: {
        pageTitle: 'Accesso Admin · Note Markdown',
        heading: '📝 Amministrazione — Note Markdown',
        subheading: 'Accesso riservato agli amministratori',
        usernameLabel: 'Username',
        passwordLabel: 'Password',
        loginBtn: 'Accedi',
        langLabel: 'Lingua',
        langAuto: 'Sistema / Auto',
        langIt: 'Italiano',
        langEn: 'English',
        langFr: 'Français',
        themeLabel: 'Tema',
        themeAuto: 'Sistema / Auto',
        themeLight: 'Chiaro',
        themeDark: 'Scuro'
      },
      en: {
        pageTitle: 'Admin Login · Markdown Notes',
        heading: '📝 Administration — Markdown Notes',
        subheading: 'Access restricted to administrators',
        usernameLabel: 'Username',
        passwordLabel: 'Password',
        loginBtn: 'Log in',
        langLabel: 'Language',
        langAuto: 'System / Auto',
        langIt: 'Italiano',
        langEn: 'English',
        langFr: 'Français',
        themeLabel: 'Theme',
        themeAuto: 'System / Auto',
        themeLight: 'Light',
        themeDark: 'Dark'
      },
      fr: {
        pageTitle: 'Connexion Admin · Notes Markdown',
        heading: '📝 Administration — Notes Markdown',
        subheading: 'Accès réservé aux administrateurs',
        usernameLabel: "Nom d'utilisateur",
        passwordLabel: 'Mot de passe',
        loginBtn: 'Se connecter',
        langLabel: 'Langue',
        langAuto: 'Système / Auto',
        langIt: 'Italiano',
        langEn: 'English',
        langFr: 'Français',
        themeLabel: 'Thème',
        themeAuto: 'Système / Auto',
        themeLight: 'Clair',
        themeDark: 'Sombre'
      }
    };

    function detectSystemLang() {
      var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (nav.indexOf('it') === 0) return 'it';
      if (nav.indexOf('fr') === 0) return 'fr';
      return 'en';
    }

    function resolveLang(pref) {
      if (!pref || pref === 'auto') return detectSystemLang();
      return translations[pref] ? pref : detectSystemLang();
    }

    function applyTranslations(lang) {
      var dict = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.title = dict.pageTitle;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
    }

    function resolveTheme(pref) {
      if (pref === 'light' || pref === 'dark') return pref;
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return dark ? 'dark' : 'light';
    }

    function applyTheme(pref) {
      var theme = resolveTheme(pref);
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b1120' : '#f6f7fb');
    }

    document.addEventListener('DOMContentLoaded', function () {
      var LANG_KEY = 'scripta_admin_lang';
      var THEME_KEY = 'scripta_admin_theme';

      var langSelect = document.getElementById('lang-select');
      var storedLang = localStorage.getItem(LANG_KEY) || 'auto';
      langSelect.value = storedLang;
      applyTranslations(resolveLang(storedLang));
      langSelect.addEventListener('change', function () {
        localStorage.setItem(LANG_KEY, langSelect.value);
        applyTranslations(resolveLang(langSelect.value));
      });

      var themeSelect = document.getElementById('theme-select');
      var storedTheme = localStorage.getItem(THEME_KEY) || 'auto';
      themeSelect.value = storedTheme;
      applyTheme(storedTheme);
      themeSelect.addEventListener('change', function () {
        localStorage.setItem(THEME_KEY, themeSelect.value);
        applyTheme(themeSelect.value);
      });
      if (window.matchMedia) {
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        var onChange = function () {
          if ((localStorage.getItem(THEME_KEY) || 'auto') === 'auto') applyTheme('auto');
        };
        if (query.addEventListener) query.addEventListener('change', onChange);
      }
    });
  </script>
</body>
</html>
{{end}}
