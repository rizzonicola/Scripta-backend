services:
  notes-server:
    build: .
    image: notes-server:latest
    container_name: notes-server
    restart: unless-stopped
    ports:
      # Esposto solo su localhost: davanti va messo un reverse proxy / tunnel
      # (Cloudflare Tunnel, Caddy, nginx) che termina TLS.
      - "127.0.0.1:8080:8080"
    environment:
      DB_PATH: /data/app.db
      PORT: "8080"
      # OBBLIGATORI, nessun default: se mancano `docker compose up` fallisce
      # e il server rifiuta comunque valori d'esempio/troppo corti.
      # Definirli in un file .env (NON committato), vedi .env.example.
      JWT_SECRET: "${JWT_SECRET:?Impostare JWT_SECRET (min 32 caratteri casuali)}"
      ADMIN_USER: "${ADMIN_USER:?Impostare ADMIN_USER}"
      ADMIN_PASS: "${ADMIN_PASS:?Impostare ADMIN_PASS (min 12 caratteri)}"
      # IP/CIDR dei reverse proxy fidati (separati da virgola). Solo da questi
      # peer vengono creduti Cf-Connecting-IP / X-Forwarded-For. Vuoto = mai.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # --- Opzionali: modalità "embedded replica" verso Turso/libSQL server ---
      TURSO_SYNC_URL: "${TURSO_SYNC_URL:-}"
      TURSO_AUTH_TOKEN: "${TURSO_AUTH_TOKEN:-}"
      TURSO_SYNC_INTERVAL: "${TURSO_SYNC_INTERVAL:-}"
    volumes:
      - notes-data:/data
    stop_grace_period: 40s   # > shutdown graceful del server (30s)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  notes-data:
    driver: local
